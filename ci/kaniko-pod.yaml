apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins
  hostAliases:
  - ip: "192.168.0.100"
    hostnames:
    - "harbor.local"
  containers:
  - name: kaniko
    image: ghcr.io/osscontainertools/kaniko:debug
    command: ['/busybox/cat']
    tty: true
    volumeMounts:
    - name: kaniko-secret
      mountPath: /kaniko/.docker
    - name: ca-cert
      mountPath: /certs/ca.crt
      subPath: additional-ca-cert-bundle.crt
  volumes:
  - name: kaniko-secret
    secret:
      secretName: harbor-push-secret
      items:
      - key: .dockerconfigjson
        path: config.json
  - name: ca-cert
    secret:
      secretName: harbor-ca-cert
