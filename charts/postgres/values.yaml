global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: "17.6.0-debian-12-r4"
  pullPolicy: IfNotPresent

auth:
  database: "java_db"
  username: "java_user"
  existingSecret: "postgres-secret"

primary:
  podLabels:
    app: postgres
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
