replicaCount: 1

image:
  repository: backend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-push-secret

existingSecret: "backend-db-secret"

service:
  port: 8081

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

probes:
  liveness:
    path: /manage/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 20
  readiness:
    path: /manage/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10

config:
  POSTGRES_HOST: "postgres-postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "java_user"
  POSTGRES_DB: "java_db"
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
  FLUENTD_ENABLED: "false"
  FLUENTD_HOST: "localhost"
  FLUENTD_PORT: "24224"
  SERVER_PORT: "8081"
  DEBUG: "true"

customLabels:
  app: backend

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8081

podLabels:
  app: backend
